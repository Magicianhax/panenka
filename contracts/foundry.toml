[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./broadcast" }]

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech"
xlayer         = "https://rpc.xlayer.tech"

[etherscan]
xlayer_testnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/xlayer-test/contract/verify", chain = 195 }
xlayer         = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/xlayer/contract/verify", chain = 196 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
